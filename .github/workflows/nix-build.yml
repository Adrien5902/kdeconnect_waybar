name: Nix Build
on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: kdeconnectwaybar
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build .#default